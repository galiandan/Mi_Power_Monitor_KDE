name: Sync upstream backend

concurrency:
  group: sync-upstream-backend
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out widget repository
        uses: actions/checkout@v6
        with:
          path: widget

      - name: Check out backend repository
        uses: actions/checkout@v6
        with:
          repository: galiandan/Mi_Power_Monitor
          ref: main
          path: upstream
          persist-credentials: false

      - name: Copy backend source and dependency manifests
        working-directory: widget
        shell: bash
        run: |
          mkdir -p backend/cmd
          rsync -a --delete ../upstream/cmd/ backend/cmd/
          for file in go.mod go.sum requirements.txt config.example.json xiaomi_power.py THIRD_PARTY_NOTICES.md; do
            if [[ -f "../upstream/$file" ]]; then
              cp "../upstream/$file" "backend/$file"
            else
              rm -f "backend/$file"
            fi
          done

      - name: Record upstream revision
        id: upstream
        working-directory: upstream
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: widget/backend/go.mod
          cache: true
          cache-dependency-path: widget/backend/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate the bundled backend integration
        working-directory: widget/backend
        shell: bash
        run: |
          go vet ./...
          go build ./...
          go test ./...
          python -m py_compile xiaomi_power.py read-readings.py read-sensors.py
          python -m unittest discover -s tests -v
          bash -n read-sensors.sh
          bash -n ../install.sh
          bash -n ../uninstall.sh
          bash -n ../setup-rapl-access.sh

      - name: Create or update sync pull request
        id: sync-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          path: widget
          branch: automation/sync-upstream-backend
          delete-branch: true
          commit-message: 'chore: sync backend from upstream'
          title: 'chore: sync backend from upstream'
          body: |
            Updates the bundled backend from upstream commit `${{ steps.upstream.outputs.commit }}`.

            Before opening this pull request, the workflow ran Go vet/build, Python compilation, the sensor and JSON protocol regression checks, and shell syntax checks against this exact copied tree.

            This pull request is managed by the scheduled upstream sync workflow. Automatic merge is requested only after those checks pass.

      - name: Enable automatic merge
        if: steps.sync-pr.outputs.pull-request-number != ''
        working-directory: widget
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.sync-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
